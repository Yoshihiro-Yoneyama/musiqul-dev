services:
  db:
    image: postgres:19-alpine
    container_name: db
    restart: unless-stopped
    ports:
      - "34961:5432"
    volumes:
      # PostgreSQL 18 以降の公式イメージは /var/lib/postgresql に 1 つだけマウントする
      # （データは /var/lib/postgresql/<メジャーバージョン>/docker に置かれる）
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: msqdb
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgadmin
    healthcheck:
      # 初期化中の一時サーバーは TCP を受け付けないため、-h で TCP 経由の応答を確認する
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgadmin -d msqdb"]
      interval: 5s
      timeout: 5s
      retries: 12
  flyway:
    image: flyway/flyway:13
    container_name: flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/sql
      - ./db/conf:/flyway/conf
  api:
    image: gradle:8.7.0-jdk21
    container_name: api
    working_dir: /app
    environment:
      - DATASOURCE_URL=jdbc:postgresql://db:5432/msqdb
      - DATASOURCE_USERNAME=pgadmin
      - DATASOURCE_PASSWORD=pgadmin
      - GRADLE_OPTS=-Dorg.gradle.daemon=false
    volumes:
      - ./api:/app
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "34962:8080"
    command: ./gradlew clean bootRun -x test
    depends_on:
      - db
  web:
    image: node:22
    container_name: web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "34963:3000"
    environment:
      - WATCHPACK_POLLING=true
    command: >
      /bin/sh -c '
        npm install &&
        npm run dev
      '
volumes:
  db-data:
    name: db-data
  gradle-cache:
